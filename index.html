<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR — Чехарда</title>
  <style>
    /* Фон обязан оставаться прозрачным: MindAR кладёт <video> с отрицательным
       z-index, и любая непрозрачная заливка body закроет собой кадр камеры. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
    }

    #ar-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #hint {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding-top: 24px;
      pointer-events: none;
    }

    #hint span {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 15px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    #status {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      /* Выше стартового экрана: иначе ошибки запуска не видно под ним. */
      z-index: 40;
      box-sizing: border-box;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.75);
      color: #8f8;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.45;
      /* Ровно две строки: журнал прокручивается к последней записи,
         поэтому виден всегда свежий вывод. */
      max-height: calc(2 * 1.45em + 12px);
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #status .err { color: #f77; }

    /* iOS не даёт доступ к камере без явного действия пользователя,
       поэтому запуск всегда идёт по нажатию. */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #101410;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #gate h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
    }

    #gate-steps {
      margin: 0;
      padding-left: 22px;
      max-width: 320px;
      text-align: left;
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.85;
    }

    #gate-steps li + li { margin-top: 6px; }

    #gate-note {
      margin: 0;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.55;
    }

    /* Вертикальный ползунок сбоку. Поворот через transform, а не
       writing-mode: последний не понимают браузеры старше 2024 года. */
    #smooth-ctl {
      position: fixed;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 4px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      user-select: none;
    }

    #smooth-wrap {
      height: 150px;
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #smooth {
      width: 145px;
      transform: rotate(-90deg);
      accent-color: #7cbf58;
    }

    .smooth-cap { opacity: 0.6; }

    #gate-warn {
      margin: 0;
      max-width: 320px;
      padding: 12px 14px;
      box-sizing: border-box;
      background: #4a2410;
      border: 1px solid #b45309;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }

    #start-btn {
      margin-top: 8px;
      padding: 16px 34px;
      font-size: 17px;
      font-weight: 600;
      color: #10240f;
      background: #7cbf58;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    #start-btn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="hint"><span>Наведите камеру на открытку</span></div>
  <div id="status"></div>

  <div id="gate">
    <h1>Чехарда AR</h1>
    <ol id="gate-steps">
      <li>Нажмите кнопку ниже.</li>
      <li>Браузер спросит доступ к камере — нажмите «Разрешить».</li>
      <li>Наведите камеру на картинку целиком.</li>
    </ol>
    <button id="start-btn" type="button">Запустить камеру</button>
    <p id="gate-note">Без доступа к камере дополненная реальность не работает. Разрешение спрашивается один раз.</p>
    <p id="gate-warn" hidden></p>
  </div>

  <div id="smooth-ctl" hidden>
    <span id="smooth-val">0.00</span>
    <div id="smooth-wrap">
      <input id="smooth" type="range" min="0" max="1" step="0.01" value="0"
             aria-label="Сглаживание" />
    </div>
    <span class="smooth-cap">сглаж.</span>
  </div>

  <script>
    // Диагностика должна работать даже если модуль ниже не загрузился вовсе.
    const statusEl = document.getElementById("status");

    function log(message, isError) {
      const line = document.createElement("div");
      if (isError) line.className = "err";
      line.textContent = message;
      statusEl.appendChild(line);
      statusEl.scrollTop = statusEl.scrollHeight;
    }

    window.log = log;

    window.addEventListener("error", (e) => {
      log("ОШИБКА: " + (e.message || e.error), true);
    });
    window.addEventListener("unhandledrejection", (e) => {
      log("ОШИБКА (promise): " + (e.reason && e.reason.message ? e.reason.message : e.reason), true);
    });

    log("страница загружена");
    if (!window.isSecureContext) {
      log("ВНИМАНИЕ: небезопасный контекст — камера будет заблокирована", true);
    }

    // Встроенные окна мессенджеров (Telegram, VK, Instagram и прочие) часто
    // не дают доступ к камере и делают это молча. Предупреждаем заранее.
    (function detectInAppBrowser() {
      const ua = navigator.userAgent;
      const known = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|VKAndroidApp|OKApp|Snapchat|Pinterest|TikTok/i.test(ua);
      const noMediaApi = !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;

      if (!known && !noMediaApi) return;

      const warn = document.getElementById("gate-warn");
      warn.textContent = noMediaApi
        ? "Этот браузер не даёт доступ к камере. Откройте ссылку в Safari или Chrome: меню «…» → «Открыть в браузере»."
        : "Похоже, страница открыта внутри приложения. Если камера не заработает, откройте ссылку в Safari или Chrome.";
      warn.hidden = false;

      log(noMediaApi ? "getUserMedia недоступен — встроенный браузер" : "похоже на встроенный браузер приложения", noMediaApi);
    })();

    // Если модульный скрипт не стартует (старый Safari, заблокированный CDN),
    // страница выглядит просто мёртвой. Сообщаем об этом явно.
    window.__moduleReady = false;
    setTimeout(() => {
      if (!window.__moduleReady) {
        log("МОДУЛЬ НЕ ВЫПОЛНИЛСЯ — кнопка работать не будет", true);
        log("частая причина: браузер не поддерживает карты импортов (Safari младше 16.4)", true);
        log("браузер: " + navigator.userAgent, true);
      }
    }, 7000);
  </script>

  <!-- Safari понимает карты импортов только с 16.4. На более старых iOS модуль
       не разрешит имя "three" и скрипт молча не выполнится — полифил это чинит.
       В браузерах со штатной поддержкой он ничего не делает. -->
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.wasm.js"></script>

  <!-- Карта импортов обязана идти ДО модульных скриптов: mindar внутри себя
       делает import from "three", и без неё браузер такой идентификатор не разрешит. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
    import { MindARThree } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js";

    const log = window.log;
    const hint = document.getElementById("hint");
    const hintText = hint.querySelector("span");

    window.__moduleReady = true;
    log("библиотеки загружены (three + mindar)");

    // Штатный фильтр MindAR задаётся только при создании контроллера и на лету
    // не меняется, поэтому оставляем его значения по умолчанию, а сглаживание
    // регулируем своим слоем ниже — его сила меняется мгновенно.
    const params = new URLSearchParams(location.search);
    const filterMinCF = parseFloat(params.get("cf")) || 0.001;
    const filterBeta = parseFloat(params.get("beta")) || 1000;

    const mindarThree = new MindARThree({
      container: document.getElementById("ar-container"),
      imageTargetSrc: "./assets/targets.mind",
      filterMinCF,
      filterBeta,
      // Встроенные оверлеи MindAR затемняют кадр; своя подсказка нагляднее.
      uiLoading: "no",
      uiScanning: "no",
      uiError: "no",
    });

    log(`сглаживание: cf=${filterMinCF}, beta=${filterBeta}`);

    const { renderer, scene, camera } = mindarThree;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(0.5, 1, 0.5);
    scene.add(ambientLight, directionalLight);

    const anchor = mindarThree.addAnchor(0);

    // Модель висит не на самом якоре, а на промежуточном узле, который каждый
    // кадр плавно подтягивается к его положению. Так силу сглаживания можно
    // менять на лету, чего штатный фильтр MindAR не позволяет.
    const holder = new THREE.Group();
    holder.visible = false;
    scene.add(holder);

    // Ползунок показывает СИЛУ сглаживания: 0 — его нет вовсе (модель ведёт
    // себя ровно как без нашего слоя), 1 — максимальное.
    // Внутри работаем долей приближения к цели за кадр: 1 — мгновенно, 0.03 —
    // очень плавно. Связь степенная: шаг ползунка ощущается одинаково по всей
    // шкале, тогда как при линейной верхняя половина почти не различалась бы.
    const ALPHA_MIN = 0.03;
    const toAlpha = (s) => (s <= 0 ? 1 : Math.pow(ALPHA_MIN, s));

    let smoothing = parseFloat(params.get("smooth"));
    if (!(smoothing >= 0 && smoothing <= 1)) smoothing = 0;

    const smoothCtl = document.getElementById("smooth-ctl");
    const smoothInput = document.getElementById("smooth");
    const smoothVal = document.getElementById("smooth-val");

    smoothInput.value = String(smoothing);
    smoothVal.textContent = smoothing.toFixed(2);
    smoothInput.addEventListener("input", () => {
      smoothing = parseFloat(smoothInput.value);
      smoothVal.textContent = smoothing.toFixed(2);
    });

    anchor.onTargetFound = () => {
      log("ТАРГЕТ НАЙДЕН");
      hint.style.opacity = "0";
    };
    anchor.onTargetLost = () => {
      log("таргет потерян");
      hint.style.opacity = "1";
    };

    // Модель грузим параллельно со стартом AR: ждать её до запуска камеры незачем.
    // ?model=full — исходная плотность (1,92 млн треугольников),
    // по умолчанию — прорежённая до ~500 тыс. для сравнения.
    const modelFile =
      params.get("model") === "full"
        ? "./assets/model.glb"
        : "./assets/model-lite.glb";

    log("загружаю " + modelFile.replace("./assets/", "") + " ...");

    // Геометрия сжата Draco — без декодера GLTFLoader её не распакует.
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/");

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    // Модель может быть сжата EXT_meshopt_compression — без этого декодера
    // GLTFLoader такой файл не откроет.
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    gltfLoader.load(
      modelFile,
      (gltf) => {
        const model = gltf.scene;

        // Автоподбор масштаба: вписываем модель в 1 единицу — столько занимает
        // ширина отслеживаемой картинки в системе координат якоря MindAR.
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 1 / maxDim;

        model.scale.setScalar(scale);
        model.position.sub(center.multiplyScalar(scale));

        // Плоскость картинки — это XY, а +Z смотрит от неё к зрителю.
        // glTF отдаёт модель осью Y вверх, поэтому поворачиваем, чтобы она
        // стояла НАД открыткой, а не лежала на ней плашмя.
        const pivot = new THREE.Group();
        pivot.rotation.x = Math.PI / 2;
        pivot.add(model);

        holder.add(pivot);
        smoothCtl.hidden = false;
        hintText.textContent = "Наведите камеру на открытку";
        log(`модель добавлена (габариты ${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}, масштаб ${scale.toFixed(4)})`);
      },
      (progress) => {
        if (progress.total) {
          const mb = (progress.loaded / 1048576).toFixed(1);
          const totalMb = (progress.total / 1048576).toFixed(1);
          // По мобильной сети загрузка занимает время: без индикации
          // пустой экран выглядит как поломка.
          hintText.textContent = `Загрузка модели: ${mb} из ${totalMb} МБ`;
          log(`модель: ${mb} / ${totalMb} МБ`);
        }
      },
      (error) => {
        log("не удалось загрузить модель: " + (error && error.message ? error.message : error), true);
      }
    );

    // Пробный запрос камеры: MindAR при отказе отдаёт невнятную ошибку,
    // а здесь виден точный код — по нему понятно, что чинить.
    const probeCamera = async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("getUserMedia недоступен в этом браузере", true);
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
        });
        const track = stream.getVideoTracks()[0];
        log(`доступ к камере получен: "${track ? track.label : "?"}"`);
        stream.getTracks().forEach((t) => t.stop()); // отдаём камеру MindAR
        return true;
      } catch (e) {
        const name = e && e.name ? e.name : "?";
        log(`КАМЕРА НЕДОСТУПНА [${name}]: ${e && e.message ? e.message : e}`, true);
        if (name === "NotAllowedError") {
          log("доступ запрещён. iOS: Настройки → Safari → Камера → Спросить;", true);
          log("а также Настройки → Экранное время → Контент и конфиденциальность → Камера", true);
        } else if (name === "NotFoundError") {
          log("камера в системе не найдена", true);
        } else if (name === "NotReadableError") {
          log("камеру занял другой процесс — закройте прочие приложения", true);
        }
        return false;
      }
    };

    const start = async () => {
      try {
        log(`браузер: ${navigator.userAgent}`);
        log(`защищённый контекст: ${window.isSecureContext}`);

        // На совсем старых устройствах WebGL может отсутствовать —
        // без него рендерить нечем.
        const probe = document.createElement("canvas");
        if (!(probe.getContext("webgl") || probe.getContext("experimental-webgl"))) {
          log("WebGL недоступен — устройство не потянет AR", true);
          return;
        }

        if (!(await probeCamera())) return;

        log("запускаю камеру и трекинг ...");
        await mindarThree.start();
        log("камера запущена, трекинг активен");

        // Кадр может быть чёрным по двум причинам: поток пустой либо видео не
        // видно. Выясняем, что именно, по фактическому состоянию элемента.
        setTimeout(() => {
          const video = document.querySelector("#ar-container video");
          if (!video) {
            log("видеоэлемент не найден в DOM", true);
            return;
          }
          log(`видео: ${video.videoWidth}x${video.videoHeight}, readyState=${video.readyState}, paused=${video.paused}`);

          const rect = video.getBoundingClientRect();
          const style = getComputedStyle(video);
          log(`на экране: ${Math.round(rect.width)}x${Math.round(rect.height)}, visibility=${style.visibility}, opacity=${style.opacity}, z-index=${style.zIndex}`);

          const track = video.srcObject && video.srcObject.getVideoTracks
            ? video.srcObject.getVideoTracks()[0]
            : null;
          if (track) {
            const s = track.getSettings();
            log(`камера: "${track.label}" ${s.width}x${s.height}, enabled=${track.enabled}, muted=${track.muted}, state=${track.readyState}`);
          } else {
            log("видеопоток не привязан к элементу", true);
          }
        }, 2500);
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        const scl = new THREE.Vector3();
        let locked = false;

        renderer.setAnimationLoop(() => {
          const g = anchor.group;

          if (g.visible) {
            g.matrix.decompose(pos, quat, scl);

            const alpha = toAlpha(smoothing);

            // На нуле и в первый кадр после захвата ставим точно: иначе модель
            // заметно подползала бы к цели издалека.
            if (!locked || alpha >= 1) {
              holder.position.copy(pos);
              holder.quaternion.copy(quat);
              holder.scale.copy(scl);
              locked = true;
            } else {
              holder.position.lerp(pos, alpha);
              holder.quaternion.slerp(quat, alpha);
              holder.scale.lerp(scl, alpha);
            }
            holder.visible = true;
          } else {
            holder.visible = false;
            locked = false;
          }

          renderer.render(scene, camera);
        });
      } catch (e) {
        log("СТАРТ НЕ УДАЛСЯ: " + (e && e.message ? e.message : e), true);
      }
    };

    // Запуск строго по нажатию: iOS не выдаёт разрешение на камеру
    // при автоматическом обращении к ней во время загрузки страницы.
    const gate = document.getElementById("gate");
    const startBtn = document.getElementById("start-btn");

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Запускаю ...";
      gate.style.display = "none";
      await start();
    });
  </script>
</body>
</html>
